<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a2018"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8ea"/>
      <stop offset="100%" stop-color="#ece0c2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d578"/>
      <stop offset="100%" stop-color="#a87833"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Декоративный круговой орнамент -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>

  <!-- Центральная плитка маджонг с символом "中" (Красный дракон) -->
  <g filter="url(#shadow)">
    <!-- Тень -->
    <rect x="148" y="148" width="216" height="216" rx="20" fill="#000" opacity="0.4" transform="translate(4, 8)"/>

    <!-- Сама плитка -->
    <rect x="148" y="148" width="216" height="216" rx="20" fill="url(#tile)" stroke="#c8b890" stroke-width="2"/>
    <!-- Блик -->
    <rect x="148" y="148" width="216" height="60" rx="20" fill="#ffffff" opacity="0.4"/>
    <rect x="148" y="148" width="216" height="216" rx="20" fill="none" stroke="#fff" stroke-width="1" opacity="0.8"/>

    <!-- Символ 中 (красный дракон) -->
    <text x="256" y="340" text-anchor="middle"
          font-family="'Noto Serif SC', 'Songti SC', serif"
          font-size="180" font-weight="700"
          fill="#c8202a">中</text>
  </g>

  <!-- Маленькие акценты по углам -->
  <circle cx="80" cy="80" r="6" fill="url(#gold)"/>
  <circle cx="432" cy="80" r="6" fill="url(#gold)"/>
  <circle cx="80" cy="432" r="6" fill="url(#gold)"/>
  <circle cx="432" cy="432" r="6" fill="url(#gold)"/>
</svg>
